<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 苍穹背景: 深蓝 → 靛青 -->
    <radialGradient id="sky" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="55%" stop-color="#061020"/>
      <stop offset="100%" stop-color="#020810"/>
    </radialGradient>
    <!-- 鲲鹏身躯: 深海青 → 碧蓝 → 金辉(腹部高光) -->
    <linearGradient id="body" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0B2D3A"/>
      <stop offset="35%" stop-color="#145A6E"/>
      <stop offset="65%" stop-color="#1E8FA3"/>
      <stop offset="90%" stop-color="#4EC9B0"/>
      <stop offset="100%" stop-color="#E8C56D"/>
    </linearGradient>
    <!-- 翼羽: 青 → 金渐变，展翅如云 -->
    <linearGradient id="wing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#145A6E"/>
      <stop offset="50%" stop-color="#1E8FA3"/>
      <stop offset="100%" stop-color="#F0D87C"/>
    </linearGradient>
    <!-- 右翼渐变 -->
    <linearGradient id="wingR" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#145A6E"/>
      <stop offset="50%" stop-color="#1E8FA3"/>
      <stop offset="100%" stop-color="#F0D87C"/>
    </linearGradient>
    <!-- 扶摇旋风/水流 -->
    <linearGradient id="whirl" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4EC9B0" stop-opacity="0"/>
      <stop offset="40%" stop-color="#4EC9B0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F0D87C" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <circle cx="128" cy="128" r="124" fill="url(#sky)"/>
  <circle cx="128" cy="128" r="122" fill="none" stroke="#1E8FA3" stroke-width="1" opacity="0.3"/>
  <circle cx="128" cy="128" r="116" fill="none" stroke="#4EC9B0" stroke-width="0.6" opacity="0.15" stroke-dasharray="5 8"/>

  <!-- === 鲲鹏主体组 === 整体右倾约15度，呈斜向上的跃出之势 -->
  <g transform="translate(128, 148) rotate(-15, 0, 0)">
    
    <!-- 尾鳍 — 水中部分，散开如鱼尾 -->
    <path d="M -12 60 Q -28 68 -42 80 Q -30 72 -12 66 Q -10 76 -18 88 Q -6 78 -4 66 Q 4 78 12 88 Q 6 76 8 66 Q 28 72 36 80 Q 24 68 8 60 Z" 
          fill="#0B2D3A" stroke="#1E8FA3" stroke-width="1" opacity="0.85"/>

    <!-- 尾鳍中线光 -->
    <path d="M -2 60 L -2 74" stroke="#4EC9B0" stroke-width="1" opacity="0.5"/>

    <!-- 鲲身 — S 形弧线躯干，由下往上由粗到细 -->
    <path d="
      M -20 58
      C -30 42, -32 24, -18 8
      C -10 -4, 0 -16, 8 -32
      C 12 -40, 14 -50, 10 -58
      C 6 -50, 2 -42, 4 -34
      C 8 -20, 4 -8, 0 4
      C -4 18, -8 36, -4 54
      C 0 64, 8 70, 16 72
      C 28 68, 32 56, 28 44
      C 24 30, 14 16, 6 2
      C 0 -8, -2 -20, -4 -34
      C -6 -44, -8 -54, -10 -58
      C -14 -50, -18 -40, -16 -30
      C -12 -14, -8 -2, -4 10
      C 2 26, 10 40, 20 52
      C 28 62, 30 66, 24 70
      Z
    " fill="url(#body)" stroke="#4EC9B0" stroke-width="0.8"/>

    <!-- 脊骨光带 -->
    <path d="M -4 54 C -12 34, -10 12, -4 -14 C -2 -24, -2 -36, -4 -44" 
          fill="none" stroke="#E8C56D" stroke-width="1.5" opacity="0.6"/>

    <!-- 腹侧高光 — 右侧亮线 -->
    <path d="M 12 52 C 18 40, 12 22, 6 6 C 2 -6, -2 -16, -4 -28" 
          fill="none" stroke="#F0D87C" stroke-width="1" opacity="0.5"/>

    <!-- 鱼鳞纹理 — 弧线暗示鳞片 -->
    <g stroke="#4EC9B0" stroke-width="0.4" fill="none" opacity="0.35">
      <path d="M -10 46 Q 0 42 10 48"/>
      <path d="M -14 34 Q -2 30 10 36"/>
      <path d="M -16 22 Q -4 18 8 24"/>
      <path d="M -14 10 Q -2 6 4 12"/>
      <path d="M -8 -2 Q 2 -6 2 0"/>
    </g>

    <!-- === 左翼 — 大鵬展翅，向上向后伸展 === -->
    <g filter="url(#glow)">
      <!-- 主翼面 -->
      <path d="
        M -10 -30
        C -24 -38, -44 -52, -68 -64
        C -58 -58, -48 -48, -38 -40
        C -56 -54, -76 -68, -92 -76
        C -80 -66, -64 -54, -46 -44
        C -64 -56, -82 -66, -96 -70
        C -78 -58, -58 -44, -42 -34
        C -48 -30, -56 -20, -62 -8
        C -52 -14, -40 -22, -28 -26
        C -30 -18, -32 -8, -28 2
        Z
      " fill="url(#wing)" opacity="0.92"/>

      <!-- 飞羽刻线 -->
      <g stroke="#E8C56D" stroke-width="0.6" fill="none" opacity="0.55">
        <path d="M -24 -24 Q -44 -42 -64 -56"/>
        <path d="M -26 -20 Q -48 -34 -70 -44"/>
        <path d="M -28 -14 Q -50 -24 -74 -30"/>
        <path d="M -28 -6 Q -48 -14 -68 -18"/>
        <path d="M -24 2 Q -40 -4 -58 -8"/>
      </g>
    </g>

    <!-- === 右翼 — 对称展开，向右后上方 === -->
    <g filter="url(#glow)">
      <path d="
        M 6 -36
        C 12 -48, 20 -62, 32 -74
        C 26 -62, 22 -52, 16 -42
        C 24 -58, 34 -70, 48 -78
        C 40 -64, 32 -52, 20 -42
        C 30 -54, 42 -64, 54 -70
        C 42 -56, 30 -44, 18 -34
        C 22 -28, 26 -18, 28 -6
        C 22 -14, 16 -20, 10 -24
        C 14 -14, 16 -4, 14 4
        Z
      " fill="url(#wingR)" opacity="0.92"/>

      <g stroke="#E8C56D" stroke-width="0.6" fill="none" opacity="0.55">
        <path d="M 10 -30 Q 24 -44 42 -58"/>
        <path d="M 12 -24 Q 28 -36 46 -46"/>
        <path d="M 14 -16 Q 30 -26 48 -32"/>
        <path d="M 16 -8 Q 30 -16 46 -20"/>
        <path d="M 14 0 Q 26 -6 40 -8"/>
      </g>
    </g>

    <!-- 头部 — 鹏首，带冠羽 -->
    <g>
      <!-- 冠羽 -->
      <path d="M -6 -56 Q -10 -64 -12 -72 M -2 -58 Q -4 -66 -2 -74 M 2 -56 Q 4 -64 2 -72" 
            stroke="#F0D87C" stroke-width="0.9" fill="none" opacity="0.8"/>
      <!-- 眼眸 — 锐利 -->
      <ellipse cx="-4" cy="-48" rx="3.5" ry="4" fill="#E8C56D" opacity="0.9"/>
      <ellipse cx="-4" cy="-48" rx="1.5" ry="1.8" fill="#020810"/>
      <ellipse cx="6" cy="-46" rx="3.5" ry="4" fill="#E8C56D" opacity="0.9"/>
      <ellipse cx="6" cy="-46" rx="1.5" ry="1.8" fill="#020810"/>
      <!-- 喙 — 短而利的金喙 -->
      <path d="M 0 -52 Q 4 -56 8 -54" fill="none" stroke="#F0D87C" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- === 环境元素 === -->

  <!-- 扶摇旋风气流 — 左右环绕 -->
  <g stroke="url(#whirl)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M 30 210 Q 40 180 55 155 Q 70 130 80 110 Q 90 90 95 70"/>
    <path d="M 226 210 Q 216 180 201 155 Q 186 130 176 110 Q 166 90 161 70"/>
  </g>

  <!-- 水花飞溅 — 底部 -->
  <g filter="url(#softGlow)">
    <circle cx="28" cy="204" r="2" fill="#4EC9B0" opacity="0.7"/>
    <circle cx="228" cy="204" r="2" fill="#4EC9B0" opacity="0.7"/>
    <circle cx="50" cy="195" r="1.5" fill="#F0D87C" opacity="0.5"/>
    <circle cx="206" cy="195" r="1.5" fill="#F0D87C" opacity="0.5"/>
    <circle cx="14" cy="180" r="1.2" fill="#4EC9B0" opacity="0.4"/>
    <circle cx="242" cy="180" r="1.2" fill="#4EC9B0" opacity="0.4"/>
    <circle cx="70" cy="200" r="1" fill="#1E8FA3" opacity="0.45"/>
    <circle cx="186" cy="200" r="1" fill="#1E8FA3" opacity="0.45"/>
  </g>

  <!-- 云天星点 -->
  <g filter="url(#softGlow)">
    <circle cx="100" cy="48" r="1.2" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="156" cy="42" r="1" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="128" cy="36" r="1.4" fill="#F0D87C" opacity="0.5"/>
    <circle cx="76" cy="68" r="0.9" fill="#FFFFFF" opacity="0.3"/>
    <circle cx="180" cy="64" r="0.9" fill="#FFFFFF" opacity="0.3"/>
  </g>

  <!-- 底部水波弧线 -->
  <g stroke="#1E8FA3" stroke-width="0.7" fill="none" opacity="0.25">
    <path d="M 10 218 Q 50 210 90 218 Q 130 226 166 218 Q 200 210 246 218"/>
    <path d="M 20 224 Q 70 218 128 224 Q 186 230 236 224"/>
  </g>
</svg>
