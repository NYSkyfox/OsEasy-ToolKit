<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B3A2F"/>
      <stop offset="100%" stop-color="#0D2118"/>
    </radialGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2F5E4E"/>
      <stop offset="50%" stop-color="#1B3A2F"/>
      <stop offset="100%" stop-color="#0F211A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DE1A2"/>
      <stop offset="100%" stop-color="#00C9A7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E68C"/>
      <stop offset="100%" stop-color="#DAA520"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 外圈实线 -->
  <circle cx="128" cy="128" r="112" fill="none" stroke="#2F5E4E" stroke-width="2"/>

  <!-- 虚线内区域背景 -->
  <circle cx="128" cy="128" r="96" fill="url(#bg)"/>

  <!-- 工具箱主体 -->
  <g transform="translate(128, 130)" filter="url(#shadow)">
    <!-- 箱体下半部分 -->
    <rect x="-62" y="-8" width="124" height="72" rx="10" ry="10" 
          fill="url(#metal)" stroke="url(#glow)" stroke-width="3"/>
    
    <!-- 箱盖（打开状态） -->
    <path d="M -62 -8 L -56 -62 Q -55 -72 -45 -72 L 45 -72 Q 55 -72 56 -62 L 62 -8 Z" 
          fill="url(#metal)" stroke="url(#glow)" stroke-width="3" opacity="0.95"/>
    
    <!-- 内部深底 -->
    <path d="M -52 -8 L 52 -8 L 46 -52 L -46 -52 Z" 
          fill="#0A1811" opacity="0.8"/>
    
    <!-- 锁扣 -->
    <rect x="-10" y="-8" width="20" height="22" rx="4" ry="4" fill="url(#gold)"/>
    
    <!-- 闪电核心 -->
    <path d="M -6 -42 L 18 -16 L -2 -16 L 6 24 L -14 -6 L 6 -6 Z" 
          fill="url(#glow)" stroke="#FFFFFF" stroke-width="1" opacity="0.95"/>
    
    <!-- 两侧把手 -->
    <rect x="-76" y="18" width="14" height="24" rx="4" ry="4" fill="#2F5E4E"/>
    <rect x="62" y="18" width="14" height="24" rx="4" ry="4" fill="#2F5E4E"/>
    
    <!-- 箱角铆钉 -->
    <circle cx="-50" cy="8" r="3" fill="#DAA520"/>
    <circle cx="50" cy="8" r="3" fill="#DAA520"/>
    <circle cx="-50" cy="52" r="3" fill="#DAA520"/>
    <circle cx="50" cy="52" r="3" fill="#DAA520"/>
  </g>

  <!-- 内圈虚线 -->
  <circle cx="128" cy="128" r="96" fill="none" stroke="url(#glow)" stroke-width="1.5" opacity="0.35" stroke-dasharray="6 5"/>
</svg>