name: Build and Release EXE

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-build smoke test
        run: |
          $env:OSEASY_TEST_MODE = "1"
          python main.py
        shell: pwsh

      - name: Read config values
        id: config
        run: |
          $appName = python -c "import config; print(config.APP_NAME)"
          $versionRaw = python -c "import config; print(config.APP_VERSION)"
          # 从 APP_VERSION 中提取纯版本号，例如 "v1.8 Beta2" 或 "v1.8.0"
          if ($versionRaw -match 'v\d+(\.\d+)*(\s+(Beta|Alpha|RC)\d*)?') {
            $ver = $Matches[0] -replace '\s+', '_'
          } else {
            $ver = $versionRaw -replace '\s+', '_'
          }
          $tag = $ver
          Write-Host "APP_NAME=$appName"
          Write-Host "APP_VERSION=$ver"
          Write-Host "TAG=$tag"
          "app_name=$appName" >> $env:GITHUB_OUTPUT
          "app_version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Check if tag exists
        run: |
          $tag = "${{ steps.config.outputs.tag }}"
          git fetch --tags
          $existing = git tag -l $tag
          if ($existing) {
            Write-Error "Tag $tag already exists. Bump version in config.py before building."
            exit 1
          }
        shell: pwsh

      - name: Install UPX
        run: |
          curl -sL "https://github.com/upx/upx/releases/download/v5.2.0/upx-5.2.0-win64.zip" -o upx.zip
          Expand-Archive -Path upx.zip -DestinationPath upx
          echo "$pwd/upx/upx-5.2.0-win64" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Build EXE
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name=OsEasyToolBox `
            --icon=logo.ico `
            --upx-exclude="email*" `
            --upx-exclude="urllib*" `
            --upx-exclude="ssl*" `
            --hidden-import=email `
            --hidden-import=email.mime `
            --hidden-import=email.mime.multipart `
            --hidden-import=email.mime.text `
            --hidden-import=email.mime.base `
            --hidden-import=urllib.request `
            --hidden-import=urllib.parse `
            --collect-all=flet `
            --collect-all=flet_desktop `
            --collect-binaries=flet `
            --collect-binaries=flet_desktop `
            --collect-data=flet_desktop `
            --hidden-import=flet `
            --hidden-import=flet_desktop `
            --hidden-import=pynput.keyboard._win32 `
            --hidden-import=pynput.mouse._win32 `
            --hidden-import=httpx `
            --hidden-import=psutil `
            --hidden-import=pyautogui `
            --hidden-import=pygetwindow `
            --exclude-module=tkinter `
            --exclude-module=matplotlib `
            --exclude-module=numpy `
            --exclude-module=pandas `
            --exclude-module=PIL `
            --exclude-module=PyQt5 `
            --exclude-module=PyQt6 `
            --exclude-module=PySide2 `
            --exclude-module=PySide6 `
            --exclude-module=wx `
            --exclude-module=IPython `
            --exclude-module=jupyter `
            --exclude-module=notebook `
            --exclude-module=pydoc `
            --exclude-module=test `
            --exclude-module=distutils `
            --exclude-module=setuptools `
            --exclude-module=pkg_resources `
            --exclude-module=html `
            --exclude-module=xmlrpc `
            --exclude-module=http.server `
            --exclude-module=socketserver `
            --exclude-module=wsgiref `
            --exclude-module=pdb `
            --add-data="Fake_SCR.py;." `
            --add-data="config.py;." `
            main.py
        shell: pwsh

      - name: Post-build smoke test
        run: |
          $env:OSEASY_TEST_MODE = "1"
          .\dist\OsEasyToolBox.exe
        shell: pwsh

      - name: Compute file hash and rename EXE
        id: exe
        run: |
          $appName = "${{ steps.config.outputs.app_name }}"
          $version = "${{ steps.config.outputs.app_version }}"
          $hash = (Get-FileHash -Path dist\OsEasyToolBox.exe -Algorithm SHA256).Hash.Substring(0, 6).ToLower()
          $newName = "${appName}_${version}_${hash}.exe"
          Rename-Item -Path dist\OsEasyToolBox.exe -NewName $newName
          Write-Host "EXE_NAME=$newName"
          "exe_name=$newName" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.exe.outputs.exe_name }}
          path: dist/${{ steps.exe.outputs.exe_name }}

      - name: Generate release body
        id: release_body
        run: |
          $body = @"
## OsEasy-ToolBox ${{ steps.config.outputs.app_version }}

### 🚀 主要变更
- **底层框架升级**：flet-desktop 从 0.18 升级到 0.25，重构打包流程
- **自动提权**：启动时自动检测并弹出 UAC 提权，不再需要手动右键管理员运行
- **配置文件路径还原**：回到 C:\ToolBoxConfig.json，自动创建目录
- **目录容错**：所有文件写入前自动创建父目录，不再因目录不存在而崩溃

### 📦 构建优化
- 锁定 flet-desktop==0.25.0，正确收集 Flutter 客户端二进制到 exe
- 锁定 pyinstaller==6.11.1，避免新版兼容问题
- 增加 UPX 压缩，排除无用模块以控制体积
- GitHub Actions CI/CD 自动构建、哈希命名、发布 release

### 🐛 Bug 修复
- 修复运行时 RemoteDisconnected / HTTP 404 报错（flet client 未正确打包）
- 修复 PermissionError 写配置文件问题（自动提权 + 自动创建目录）
- 修复 ModuleNotFoundError: flet_desktop 问题
- 修复 Hidden import "flet_core" not found 警告
- 修复 flet pack 参数不兼容 0.25 问题

### ⚠️ 注意
- 首次启动会弹出 UAC 提权窗口，请点击"是"
- 旧版配置文件位于 %%APPDATA%%，新版位于 C:\，需重新配置
"@
          # 写入文件，避免 GITHUB_OUTPUT 的多行处理问题
          $body > "${{ runner.temp }}\release_body.md"
          Get-Content "${{ runner.temp }}\release_body.md"
        shell: pwsh

      - name: Create tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.config.outputs.tag }}
          name: ${{ steps.config.outputs.app_version }}
          body_path: ${{ runner.temp }}\release_body.md
          files: dist/${{ steps.exe.outputs.exe_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}