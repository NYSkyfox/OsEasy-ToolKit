name: Build and Release EXE

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
        shell: pwsh

      - name: Pre-build smoke test
        run: |
          $env:OSEASY_TEST_MODE = "1"
          python main.py
        shell: pwsh
        continue-on-error: true

      - name: Read config values
        id: config
        run: |
          $appName = python -c "from config import APP_NAME; print(APP_NAME)"
          $versionRaw = python -c "from config import APP_VERSION; print(APP_VERSION)"
          if ($versionRaw -match 'v\d+(\.\d+)*(\s+(Beta|Alpha|RC)\d*)?') {
            $ver = $Matches[0] -replace '\s+', '_'
          } else {
            $ver = $versionRaw -replace '\s+', '_'
          }
          $tag = $ver
          Write-Host "APP_NAME=$appName"
          Write-Host "APP_VERSION=$ver"
          Write-Host "TAG=$tag"
          "app_name=$appName" >> $env:GITHUB_OUTPUT
          "app_version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Check if tag exists
        run: |
          $tag = "${{ steps.config.outputs.tag }}"
          git fetch --tags
          $existing = git tag -l $tag
          if ($existing) {
            Write-Error "Tag $tag already exists. Bump version in config.py before building."
            exit 1
          }
        shell: pwsh

      - name: Build EXE (via build.py)
        run: python build.py
        shell: pwsh

      - name: Post-build smoke test
        run: |
          $env:OSEASY_TEST_MODE = "1"
          $exeName = "${{ steps.config.outputs.app_name }}.exe"
          if (Test-Path "dist\$exeName") {
            Write-Host "EXE built successfully!"
            .\dist\$exeName
          } else {
            Write-Error "EXE not found at dist\$exeName!"
            exit 1
          }
        shell: pwsh
        continue-on-error: true

      - name: Compute file hash and rename EXE
        id: exe
        run: |
          $appName = "${{ steps.config.outputs.app_name }}"
          $version = "${{ steps.config.outputs.app_version }}"
          $srcExe = "dist\$appName.exe"
          $hash = (Get-FileHash -Path $srcExe -Algorithm SHA256).Hash.Substring(0, 7).ToLower()
          $newName = "${appName}_${version}_${hash}.exe"
          Rename-Item -Path $srcExe -NewName $newName
          Write-Host "EXE_NAME=$newName"
          "exe_name=$newName" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.exe.outputs.exe_name }}
          path: dist/${{ steps.exe.outputs.exe_name }}

      - name: Create tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.config.outputs.tag }}
          name: ${{ steps.config.outputs.app_version }}
          files: dist/${{ steps.exe.outputs.exe_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}